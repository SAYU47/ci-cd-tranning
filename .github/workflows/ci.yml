name: my-app

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m py_compile app/app.py

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t devops-counter-app:1.0 ./app
      
      - name: Create CI database password
        run: |
          mkdir -p secrets
          echo "ci_test_password" > secrets/db_password.txt

      - name: Start application stack
        run: docker compose up --wait --wait-timeout 90 --no-build

      - name: Test health endpoint
        run: curl --fail --show-error http://127.0.0.1:8080/health

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-counter-app" >> "$GITHUB_ENV" 
          
      - name: Tag Docker image
        run: |
        docker tag devops-counter-app:1.0 $IMAGE_NAME:${{ github.sha }}
        docker tag devops-counter-app:1.0 $IMAGE_NAME:latest

      - name: Push Docker image
        run: |
        docker push $IMAGE_NAME:${{ github.sha }}
        docker push $IMAGE_NAME:latest         

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down -v